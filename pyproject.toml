[project]
name = "kgi-us-grid-web"
version = "0.1.1"
description = "Local US grid trading workbench with a persistent execution ledger"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "tzdata>=2025.2", "exchange-calendars>=4.7,<5", "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
broker = ["kgisuperpy==2.1.2", "paramiko>=3,<5", "tqdm>=4,<5", "websocket-client>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "playwright>=1.50,<2", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
